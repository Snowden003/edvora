name: Build and Auto Deploy to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Assets & Deploy to cPanel / Server
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install NPM dependencies
        run: npm ci || npm install

      - name: 🔨 Compile Production Frontend (Vite)
        run: npm run build

      - name: 💾 Commit & Push compiled assets (if changed)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/build/ -f
          if git diff --staged --quiet; then
            echo "No build changes to commit"
          else
            git commit -m "chore(assets): auto-build production assets [skip ci]"
            git push origin main
          fi

      - name: 🚀 Trigger cPanel Auto-Deployment Webhook (Method 1)
        if: ${{ secrets.CPANEL_WEBHOOK_URL != '' }}
        env:
          CPANEL_WEBHOOK_URL: ${{ secrets.CPANEL_WEBHOOK_URL }}
        run: |
          echo "Triggering cPanel deployment webhook..."
          curl -s -X POST "$CPANEL_WEBHOOK_URL"
          echo "Webhook successfully triggered!"

      - name: 📂 Direct FTP Deploy to Server (Method 2 - Optional)
        if: ${{ secrets.FTP_PASSWORD != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || 'business118.web-hosting.com' }}
          username: ${{ secrets.FTP_USERNAME || 'edvokttv' }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/public_html/' }}
          local-dir: ./public/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            storage/**
            index.php
            .htaccess
